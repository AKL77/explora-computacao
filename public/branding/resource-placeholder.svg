<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Imagem padrão de recurso do Informática Explorer</title>
  <desc id="description">Fundo abstrato azul com órbitas amarelas e um símbolo de informação no centro.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="0.55" stop-color="#075985"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#031926" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <rect width="1200" height="675" rx="32" fill="url(#glow)"/>
  <rect width="1200" height="675" rx="32" fill="url(#dots)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-80 518C180 666 470 658 724 544c267-120 426-324 596-478" stroke="#facc15" stroke-opacity="0.2" stroke-width="18"/>
    <path d="M-52 540C208 688 493 666 746 548c249-116 407-302 566-454" stroke="#facc15" stroke-opacity="0.9" stroke-width="7"/>
    <ellipse cx="600" cy="337.5" rx="360" ry="170" transform="rotate(-15 600 337.5)" stroke="#67e8f9" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="600" cy="214" r="46" fill="#facc15"/>
    <path d="M548 298c0-22 18-40 40-40h60v210h38c16 0 29 13 29 29s-13 29-29 29h-98c-22 0-40-18-40-40V298Z" fill="#f8fafc"/>
    <path d="M588 258h60v210h38c16 0 29 13 29 29s-13 29-29 29h-38c-33 0-60-27-60-60V258Z" fill="#cffafe" fill-opacity="0.62"/>
  </g>

  <path d="M329 345c38-107 141-184 262-184 154 0 279 125 279 279" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="9 18"/>
</svg>
