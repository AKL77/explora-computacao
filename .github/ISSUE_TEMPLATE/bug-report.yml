name: Relatar problema
description: Informe um comportamento inesperado e reproduzível.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Obrigado por ajudar a melhorar o Informática Explorer. Não inclua dados pessoais ou credenciais.
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o resultado esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir?
      placeholder: |
        1. Acesse...
        2. Selecione...
        3. Observe...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador e dispositivo
      placeholder: Ex. Chrome 138, Windows 11, notebook
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Inclua capturas sem dados pessoais, se ajudarem.
